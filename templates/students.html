<!DOCTYPE html>
<html>
<head>
    <title>Students</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<nav>
    <a href="/">Dashboard</a>
    <a href="/students">Students</a>
    <a href="/about">About</a>
</nav>

<div class="container">

<h1>Students</h1>

<table>

<tr>
    <th>ID</th>
    <th>Name</th>
    <th>Email</th>
    <th>Course</th>
    <th>Semester</th>
    <th>Action</th>
</tr>

{% for student in students %}

<tr>

<td>{{ student[0] }}</td>
<td>{{ student[1] }}</td>
<td>{{ student[2] }}</td>
<td>{{ student[3] }}</td>
<td>{{ student[4] }}</td>

<td>
<a href="/delete/{{ student[0] }}">Delete</a>
</td>

</tr>

{% endfor %}

</table>

</div>

</body>
</html>
